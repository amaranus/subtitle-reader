<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Subtitle Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      padding: 14px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    h1 { font-size: 15px; font-weight: 600; }
    .badge {
      font-size: 10px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 999px;
      padding: 2px 8px;
      color: #a1a1aa;
    }
    .status {
      font-size: 12px;
      color: #a1a1aa;
      background: #27272a;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      min-height: 32px;
      display: flex;
      align-items: center;
      word-break: break-word;
    }
    .status.active { color: #4ade80; }
    .status.error { color: #f87171; }
    .toggle {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    .toggle:hover { background: #16a34a; }
    .toggle.stop { background: #ef4444; color: #450a0a; }
    .toggle.stop:hover { background: #dc2626; }
    .toggle:disabled { background: #3f3f46; color: #71717a; cursor: not-allowed; }
    label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .segmented {
      display: flex;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 10px;
      gap: 3px;
    }
    .segmented input { display: none; }
    .segmented label {
      flex: 1;
      text-align: center;
      padding: 7px 4px;
      font-size: 12px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      color: #a1a1aa;
      border-radius: 6px;
      cursor: pointer;
      margin: 0;
    }
    .segmented input:checked + label {
      background: #3f3f46;
      color: #f4f4f5;
    }
    .segmented input:disabled + label { opacity: 0.5; cursor: not-allowed; }
    select {
      width: 100%;
      padding: 7px 8px;
      font-size: 12px;
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    select:focus { outline: 1px solid #22c55e; }
    select:disabled { opacity: 0.5; }
    label .val {
      float: right;
      color: #f4f4f5;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    input[type="range"] {
      width: 100%;
      margin-bottom: 12px;
      accent-color: #22c55e;
      cursor: pointer;
    }
    .hidden { display: none; }
    footer {
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid #27272a;
      text-align: center;
      font-size: 11px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <header>
    <h1>Subtitle Reader</h1>
    <span class="badge">YouTube</span>
  </header>

  <div class="status" id="status">Kontrol ediliyor…</div>

  <button class="toggle" id="toggleBtn">Başlat</button>

  <label>Seslendirme motoru</label>
  <div class="segmented">
    <input type="radio" name="mode" id="modeBrowser" value="browser" checked />
    <label for="modeBrowser">Tarayıcı</label>
    <input type="radio" name="mode" id="modeSt" value="supertonic" />
    <label for="modeSt">SuperTonic</label>
  </div>

  <div id="browserSection">
    <label for="voiceSel">Tarayıcı sesi</label>
    <select id="voiceSel">
      <option value="">Varsayılan ses</option>
    </select>
  </div>

  <div id="stSection" class="hidden">
    <label for="stVoiceSel">SuperTonic sesi</label>
    <select id="stVoiceSel"></select>
    <label for="stLangSel">Dil</label>
    <select id="stLangSel"></select>
  </div>

  <label for="rateSel">Hız <span class="val" id="rateVal">1.00×</span></label>
  <input type="range" id="rateSel" min="0.5" max="2" step="0.05" value="1" />

  <label for="syncSel">Gecikme senkronu</label>
  <select id="syncSel">
    <option value="off">Kapalı</option>
    <option value="catchup">Okumayı hızlandır</option>
    <option value="video">Videoyu yavaşlat</option>
    <option value="both">İkisi birden</option>
  </select>

  <label for="offsetSel">Senkron kaydırması <span class="val" id="offsetVal">0.0 sn</span></label>
  <input type="range" id="offsetSel" min="-2" max="2" step="0.1" value="0" />

  <footer>amaranus tarafından yaratıldı</footer>

  <script src="popup.js"></script>
</body>
</html>
